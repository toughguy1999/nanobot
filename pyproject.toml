# Project metadata and package dependencies
[project]
name = "nanobot-ai"
version = "0.1.3.post7"
description = "A lightweight personal AI assistant framework"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "nanobot contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "websocket-client>=1.6.0",
    "httpx[socks]>=0.25.0",
    "loguru>=0.7.0",
    "readability-lxml>=0.8.0",
    "rich>=13.0.0",
    "croniter>=2.0.0",
    "dingtalk-stream>=0.4.0",
    "python-telegram-bot[socks]>=21.0",
    "lark-oapi>=1.0.0",
    "socksio>=1.0.0",
    "python-socketio>=5.11.0",
    "msgpack>=1.0.8",
    "slack-sdk>=3.26.0",
    "qq-botpy>=1.0.0",
    "python-socks[asyncio]>=2.4.0",
    "prompt-toolkit>=3.0.0",
    "fastapi>=0.100.0",
    "pillow>=12.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.23.0",
    "mcp[cli]>=2,<3",
]

# Command-line entry points
[project.scripts]
nanobot = "nanobot.cli.commands:app"

# Build backend
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package build and distribution settings
[tool.hatch.build]
include = [
    "nanobot/**/*.py",
    "nanobot/skills/**/*.md",
    "nanobot/skills/**/*.sh",
]

[tool.hatch.build.targets.wheel]
packages = ["nanobot", "bridge"]

[tool.hatch.build.targets.wheel.sources]
"nanobot" = "nanobot"
"bridge" = "bridge"

[tool.hatch.build.targets.sdist]
include = [
    "nanobot/",
    "bridge/",
    "README.md",
    "LICENSE",
]

# Development and optional dependency groups
[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "types-croniter>=6.2.2.20260518",
    "ruff>=0.15.18",
    "mypy>=2.1.0",
]

rag = [
    "chromadb>=1.5.9",
    "flagembedding>=1.4.0",
    "sentencepiece>=0.2.0",
    "torch>=2.11.0",
    "transformers>=4.44.2,<5",
]

# uv dependency management and package sources
[tool.uv]
default-groups = ["dev", "rag"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "platform_system == 'Windows' or platform_system == 'Linux'" },
]

# Ruff linting and formatting rules
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

# Mypy static type checking
[tool.mypy]
python_version = "3.12"
exclude = [
    "(^|[\\\\/])\\.venv([\\\\/]|$)",
    "(^|[\\\\/])\\.mypy_cache([\\\\/]|$)",
    "(^|[\\\\/])\\.ruff_cache([\\\\/]|$)",
    "(^|[\\\\/])\\.uv-cache([\\\\/]|$)",
]

[[tool.mypy.overrides]]
module = [
    "readability",
    "botpy",
    "botpy.*",
    "lark_oapi",
    "lark_oapi.*",
    "socketio",
    "socketio.*",
    "msgpack",
    "numpy",
    "numpy.*",
    "dingtalk_stream",
    "dingtalk_stream.*",
]
ignore_missing_imports = true


